<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>478</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden}
body{font:11px/1.4 "Courier New",ui-monospace,monospace}
/* left: the camera, full height · right (bigger): the typeface above, the controls below */
.split{display:grid;grid-template-columns:38fr 62fr;height:100%}
.left{position:relative;border-right:1px solid #fff;min-width:0}
.right{display:flex;flex-direction:column;min-width:0;min-height:0}
#c{flex:1 1 0;width:100%;height:0;min-height:0;display:block}
.cam{position:absolute;inset:0;cursor:pointer;background:#000;overflow:hidden}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);object-fit:cover}
.cam video{opacity:.35;filter:grayscale(1)}
.cam span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.camstart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:#000;color:#fff;border:1px solid #fff;padding:14px 34px;font:inherit;font-size:15px;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
.camstart:hover{background:#fff;color:#000}
.camstart:focus-visible{outline:1px solid #fff;outline-offset:4px}
/* the finished font, shown on the right once it is built */
#fontView{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 24px}
#fv{font-family:"MyFace",sans-serif;line-height:1.1;white-space:nowrap;outline:none;color:#fff}
.axes{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px;border-top:1px solid #333;padding-top:14px}
@media (max-width:1000px){ .axes{grid-template-columns:repeat(2,minmax(0,1fr))} }
#prompt{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#fff;font-size:clamp(18px,2.4vw,30px);white-space:pre-line;text-shadow:0 0 10px #000,0 0 3px #000;pointer-events:none}
.cam.on span{display:none}
.controls{border-top:1px solid #fff;padding:14px 16px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px;align-items:end}
@media (max-width:1000px){ .controls{grid-template-columns:repeat(2,minmax(0,1fr))} }
.links{display:flex;flex-wrap:wrap;gap:6px 12px}
.links button{all:unset;cursor:pointer;color:#fff;text-decoration:underline}
.links button:disabled{color:#555;cursor:default;text-decoration:none}
.links button:focus-visible,.cam:focus-visible,input:focus-visible{outline:1px solid #fff;outline-offset:2px}
.group{display:flex;flex-direction:column;gap:6px}
#status{color:#777;margin:0;min-height:1.4em}
label{display:block;margin:0;color:#aaa}
label b{float:right;font-weight:400;color:#fff}
input[type=text]{display:block;width:100%;margin-top:3px;font:inherit;font-size:13px;color:#fff;background:transparent;border:0;border-bottom:1px solid #fff;border-radius:0;padding:2px 0}
input[type=range]{display:block;width:100%;margin:4px 0 0;accent-color:#fff}
@media (max-width:760px){
  html,body{overflow:auto}
  .split{grid-template-columns:1fr;grid-template-rows:42vh auto;height:auto}
  .left{border-right:0;border-bottom:1px solid #fff}
  #c,#fontView{flex:none;height:55vh}
}
</style>
</head>
<body>
<div class="split">
  <div class="left">
    <div class="cam" id="camBtn" role="button" tabindex="0" aria-label="Start or stop camera"><video id="video" playsinline muted></video><canvas id="mesh"></canvas><span>start camera</span><div id="prompt" aria-live="assertive"></div></div>
    <button id="startBtn" class="camstart" type="button" hidden>start</button>
  </div>
  <div class="right">
    <canvas id="c" aria-label="Letters drawn by face points"></canvas>
    <div class="controls">
      <div class="group">
        <div class="links"><button id="freezeBtn" disabled>freeze</button><button id="calBtn" disabled>reset</button><button id="savePng">save</button></div>
        <div class="links"><button id="modeBtn">mapping: random</button><button id="shuffleBtn">shuffle</button></div>
        <p id="status"></p>
      </div>
      <label>word<input type="text" id="text" value="Hello" maxlength="10" spellcheck="false"></label>
      <div class="group">
        <label>font name<input type="text" id="fontName" value="Reflect Face" maxlength="28" spellcheck="false"></label>
        <div class="links"><button id="ttfVarBtn" disabled>download variable ttf</button></div>
      </div>
      <label>resting length <b id="baseVal">20</b><input type="range" id="base" min="0" max="60" value="20"></label>
      <label>line width <b id="widthVal">1×</b><input type="range" id="width" min="0.5" max="5" step="0.25" value="1"></label>
      <div class="axes" id="axes" hidden></div>
    </div>
  </div>
</div>

<script type="module">
/* =====================================================================
   478 — every MediaPipe face landmark controls one line in each letter

   STEP 1  Capture:      MediaPipe gives 478 points per video frame.
   STEP 2  Normalize:    centre, level and scale the points so only
                         the SHAPE of the face matters.
   STEP 3  Neutral:      average a relaxed face; afterwards we only use
                         how far each point has moved from it (the delta).
   STEP 4  Map:          give each letter 478 anchor points on its
                         outline. Face point i is paired with the anchor
                         in the same direction from the centre, so
                         forehead points control the top of the letter,
                         chin points the bottom, cheeks the sides.
   STEP 5  Move & draw:  each line starts on its anchor; its tip is
                         pushed by the matching face point's delta.
   ===================================================================== */

const N = 478;
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
const off = document.createElement('canvas'), octx = off.getContext('2d', {willReadFrequently:true});
const glow = document.createElement('canvas'), gctx = glow.getContext('2d');
const FONT = '"Archivo Black", Impact, "Arial Black", sans-serif';
const S = {text:'Hello', gain:3, shape:12, base:20, width:1, angle:0};   // shape 12 = your full face shape (100%)   // angle: lines rest straight up
let W = 1, H = 1, dpr = 1, dirty = true;

/* ---------- STEP 4 (type side): every outline pixel becomes a line ---------- */
// pts stride 7: x, y, normalX, normalY, random, letterIndex, turn (0 = top of letter, clockwise to 1)
let letters = [], pts = new Float32Array(0);
let markers = [];   // markers[li][i] = index in pts of the line directly controlled by face point i

function layout(){
  const r = canvas.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = glow.width = W * dpr; canvas.height = glow.height = H * dpr;
  letters = [];
  const text = S.text;
  if (!text.trim()){ pts = new Float32Array(0); dirty = true; return; }
  off.width = Math.ceil(W); off.height = Math.ceil(H);
  octx.clearRect(0, 0, W, H);
  octx.font = `100px ${FONT}`;
  let m = octx.measureText(text);
  const gutter = 0, avail = W;   // the typeface has the right-hand panel to itself
  const fs = 100 * Math.min(avail * 0.82 / m.width, H * 0.4 / ((m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) || 75));
  octx.font = `${fs}px ${FONT}`; m = octx.measureText(text);
  const asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  const capPx = octx.measureText('H').actualBoundingBoxAscent || asc;   // cap height: the same yardstick the font file uses
  const left = gutter + avail / 2 - m.width / 2, base = H / 2 + (asc - desc) / 2;
  let prev = left;
  for (let i = 0; i < text.length; i++){
    const x1 = left + octx.measureText(text.slice(0, i + 1)).width;
    const up = text[i].toUpperCase(), key = up >= 'A' && up <= 'Z' ? up.charCodeAt(0) - 65 : 26 + text.charCodeAt(i);
    // centre = middle of the letter's width, half way up the cap height (identical rule in the font file)
    letters.push({x0: prev, x1, cx: (prev + x1) / 2, cy: base - capPx / 2, h: capPx, top: base - capPx, key}); prev = x1;
  }
  // trace the outline at double resolution: twice as many lines along every edge
  const SS = 2;
  off.width = Math.ceil(W * SS); off.height = Math.ceil(H * SS);
  octx.setTransform(SS, 0, 0, SS, 0, 0); octx.font = `${fs}px ${FONT}`; octx.textBaseline = 'alphabetic';
  octx.fillStyle = '#000'; octx.fillText(text, left, base); octx.setTransform(1, 0, 0, 1, 0, 0);
  const w = off.width, h = off.height, img = octx.getImageData(0, 0, w, h).data;
  const colLetter = new Int16Array(w);
  for (let x = 0, i = 0; x < w; x++){ while (i < letters.length - 1 && x / SS >= letters[i].x1) i++; colLetter[x] = i; }
  const A = (x, y) => img[(y * w + x) * 4 + 3];
  const out = [], R = 3;
  for (let y = R; y < h - R; y++) for (let x = R; x < w - R; x++){
    if (A(x, y) < 128) continue;
    if (A(x-1, y) >= 128 && A(x+1, y) >= 128 && A(x, y-1) >= 128 && A(x, y+1) >= 128) continue;
    let gx = 0, gy = 0;
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++){ const v = A(x+dx, y+dy); gx += v*dx; gy += v*dy; }
    const l = Math.hypot(gx, gy) || 1, li = colLetter[x], L = letters[li];
    const hsh = Math.abs(Math.sin(x*12.9898 + y*78.233) * 43758.5453) % 1;
    const px = x / SS, py = y / SS;
    const turn = (Math.atan2(py - L.cy, px - L.cx) / (Math.PI * 2) + 1.25) % 1;
    out.push(px, py, -gx/l, -gy/l, hsh, li, turn);
  }
  pts = new Float32Array(out);
  buildMapping();
  dirty = true;
}

/* each face point i owns the outline line whose turn is closest to the point's own turn on the face */
function buildMarkers(){
  markers = letters.map(() => new Int32Array(N).fill(-1));
  const best = letters.map(() => new Float32Array(N).fill(9));
  for (let j = 0; j < pts.length; j += 7){
    const li = pts[j+5], t = pts[j+6];
    for (let i = 0; i < N; i++){
      const d = Math.abs(((t - letterTurn[li][i]) % 1 + 1.5) % 1 - 0.5);
      if (d < best[li][i]){ best[li][i] = d; markers[li][i] = j; }
    }
  }
}

/* ---------- STEP 2: normalize one frame of landmarks ---------- */
// returns Float32Array(N*2): x,y for each point, centred on the face,
// rotated so the eyes are level, divided by face width, mirrored like a mirror
function normalize(lm, vw, vh){
  const px = i => lm[i].x * vw, py = i => lm[i].y * vh;   // 0–1 → pixels, so angles aren't distorted
  let mx = 0, my = 0;
  for (let i = 0; i < N; i++){ mx += px(i); my += py(i); }
  mx /= N; my /= N;                                          // face centre
  const ang = Math.atan2(py(263) - py(33), px(263) - px(33)); // eye line angle
  const size = Math.hypot(px(454) - px(234), py(454) - py(234)) || 1; // face width
  const c = Math.cos(-ang), s = Math.sin(-ang), out = new Float32Array(N * 2);
  for (let i = 0; i < N; i++){
    const dx = px(i) - mx, dy = py(i) - my;
    out[i*2]     = -(dx * c - dy * s) / size;   // minus = mirror
    out[i*2 + 1] =  (dx * s + dy * c) / size;
  }
  return out;
}

    mctx.clearRect(0, 0, mesh.width, mesh.height);

      const lm = res.faceLandmarks[0];
      mctx.fillStyle = '#fff';
      for (const p of lm) mctx.fillRect(p.x * mesh.width - 1, p.y * mesh.height - 1, 2, 2);

const OTJS_URL = 'https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js';

let baseFont = null;
function loadScript(src){

// the glyph's outline as closed polylines, in font units (y up)
function contoursOf(glyph){

/* How the font imitates the screen:

/* ---- smooth shapes for the font ---- */

// a small round dot

/* ---- variable font ----

/* ---- recorded poses ----

const POSES = [['mouth', 'open your mouth'], ['smile', 'smile'], ['brows', 'raise your eyebrows'],

const poses = {};
let poseRec = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const prompt = t => { $('prompt').textContent = t; };
async function recordPoses(){
  if (!neutral){ status('hold a relaxed face first'); return; }
  for (const [key, say] of POSES){
    for (let c = 3; c > 0; c--){ prompt(`${say}\n${c}`); await sleep(800); }
    prompt(`${say}\nhold…`); poseRec = [];
    const t0 = performance.now();
    while (poseRec.length < 25 && performance.now() - t0 < 6000) await sleep(30);
    const frames = poseRec; poseRec = null;
    if (frames.length < 8){ prompt(`no face found\nskipping`); await sleep(900); continue; }
    const d = new Float32Array(N * 2);
    for (const f of frames) for (let j = 0; j < N * 2; j++) d[j] += (f[j] - neutral[j]) / frames.length;
    poses[key] = d; prompt('✓'); await sleep(500);
  }
  prompt(''); status(`poses recorded: ${Object.keys(poses).length} of ${POSES.length}`);
}

/* ---- building blocks for the variable font ----

  const contours = cs.map(c => {

    const pts = resample(c, VAR_SPACING);

      const prev = pts[(k - 1 + pts.length) % pts.length], next = pts[(k + 1) % pts.length];
      const tx = next[0] - prev[0], ty = next[1] - prev[1], tl = Math.hypot(tx, ty) || 1, nxs = -ty / tl, nys = -tx / tl;

    const mx = Math.max(-lim, Math.min(lim, (field[b0*2] * (1-t) + field[b1*2] * t) * capH));

// An expression slider keeps the resting look: each line keeps its direction and only grows

const EXPR = {target: 0.32, maxGrow: 0.36, sway: 0.35, maxSway: 0.06, smooth: 5};   // lengths in cap heights; smooth = lines each side averaged

    runs[ci].forEach(([s0, s1]) => shapes.push(toUnits(ribbonFixed(smoothFixed(tips[ci].slice(s0, s1)), 1))));

/* gvar: for every letter and every axis, how far each point moves at the far end of that axis */
function gvarTable(v, glyphCount){
  const A = v.axes.length, shared = v.peaks;                       // peaks: one tuple per axis, e.g. [[-1,0],[0,-1]]
  const f2 = x => Math.round(x * 16384) & 0xFFFF;
  const tuples = new Bytes(); shared.forEach(t => t.forEach(c => tuples.u16(f2(c))));
  const datas = [];
  for (let gi = 0; gi < glyphCount; gi++){
    const gv = v.glyphs[gi];
    if (!gv || !gv.deltas.length){ datas.push(new Uint8Array(0)); continue; }
    const bodies = gv.deltas.map(dl => { const b = new Bytes(); packDeltas(dl.x, b); packDeltas(dl.y, b); return b; });
    const hdr = new Bytes().u16(0x8000 | bodies.length).u16(4 + bodies.length * 4);
    bodies.forEach((bd, k) => hdr.u16(bd.length).u16(gv.deltas[k].tuple));
    hdr.u8(0);                                                     // shared point numbers: "all points"
    bodies.forEach(bd => hdr.bytes(bd.a));
    if (hdr.length % 2) hdr.u8(0);
    datas.push(hdr.out());
  }
  const head = 20 + 4 * (glyphCount + 1), sharedOff = head, dataOff = head + tuples.length;
  const b = new Bytes().u16(1).u16(0).u16(A).u16(shared.length).u32(sharedOff).u16(glyphCount).u16(1).u32(dataOff);
  let off = 0; datas.forEach(d => { b.u32(off); off += d.length; }); b.u32(off);
  b.bytes(tuples.a); datas.forEach(d => b.bytes(d));
  return b.out();
}

async function makeVariableFont(){
  if (!neutral) throw new Error('hold a relaxed face first');
  const base = await getBase();
  const upm = base.unitsPerEm, os2 = base.tables.os2 || {}, capH = os2.sCapHeight || 688, xH = os2.sxHeight || 528;
  const NN = N * 2, vec = () => new Float32Array(NN);
  // face shape split down the middle (x < 0 is the person's own left side after mirroring; the midline counts half to each)
  const shapeL = vec(), shapeR = vec();
  for (let i = 0; i < N; i++){
    const x = neutral[i*2], wl = x < -0.02 ? 1 : x > 0.02 ? 0 : 0.5;
    for (const j of [i*2, i*2+1]){ shapeL[j] = shape[j] * S.shape * wl; shapeR[j] = shape[j] * S.shape * (1 - wl); }
  }
  const def = vec(); for (let j = 0; j < NN; j++) def[j] = shapeL[j] + shapeR[j];       // default: your resting face
  const plus = (v, k) => { const o = Float32Array.from(def); for (let j = 0; j < NN; j++) o[j] += v[j] * k; return o; };

  // axes, and for each axis the version of the face at its far end
  const axes = [], variants = [];
  const addAxis = (tag, name, min, d, max) => { axes.push({tag, name, min, def: d, max}); return axes.length - 1; };
  // expression sliders: e = how the face moved for that pose, G = its scale (see exprGain)
  const ex = pose => { const G = exprGain(pose), e = Float32Array.from(pose, d => d * G); return {e, v: plus(e, 1)}; };
  if (poses.mouth){ const a = addAxis('MOUT', 'Mouth open', 0, 0, 100); variants.push({a, peak: 1, ...ex(poses.mouth), label: 'Mouth Open'}); }
  if (poses.smile){ const a = addAxis('SMIL', 'Smile', 0, 0, 100); variants.push({a, peak: 1, ...ex(poses.smile), label: 'Smile'}); }
  if (poses.brows){ const a = addAxis('BROW', 'Brows', 0, 0, 100); variants.push({a, peak: 1, ...ex(poses.brows), label: 'Brows Up'}); }
  if (poses.lookL || poses.lookR){
    const a = addAxis('LOOK', 'Look', -100, 0, 100);
    if (poses.lookL) variants.push({a, peak: -1, ...ex(poses.lookL), label: 'Look Left'});
    if (poses.lookR) variants.push({a, peak: 1, ...ex(poses.lookR), label: 'Look Right'});
  }
  const aL = addAxis('LHLF', 'Left half', 0, 100, 100); variants.push({a: aL, peak: -1, v: plus(shapeL, -1)});
  const aR = addAxis('RHLF', 'Right half', 0, 100, 100); variants.push({a: aR, peak: -1, v: plus(shapeR, -1)});
  const peaks = variants.map(vr => axes.map((_, i) => i === vr.a ? vr.peak : 0));

  // every letter: the default version + how each point moves for every variant
  const flat = cs => { const p = []; cs.forEach(c => c.forEach(q => p.push(q))); return p; };
  const glyphs = [{contours: [], advance: 500 * U}, {contours: [], advance: (base.charToGlyph(' ').advanceWidth || 333) * U}], gv = [null, null];
  const chars = [];
  for (let li = 0; li < 26; li++) chars.push([String.fromCharCode(65 + li), li]);
  for (let li = 0; li < 26; li++) chars.push([String.fromCharCode(97 + li), li]);
  for (const [ch, li] of chars){
    const gb = glyphBase(base, ch, capH);
    if (gb.empty){ glyphs.push({contours: [], advance: gb.advance}); gv.push({deltas: []}); continue; }
    const tDef = tipsFor(gb, li, capH, def), tVar = variants.map(vr => tipsFor(gb, li, capH, vr.v));
    const runs = runsFor([tDef, ...tVar]);
    const P = flat(shapesFor(gb, tDef, runs)), deltas = [];
    tVar.forEach((tv, k) => {
      const Q = flat(shapesFor(gb, tv, runs));
      if (Q.length !== P.length) throw new Error(`letter ${ch} changed structure between versions`);
      const x = P.map((p, i) => Q[i][0] - p[0]).concat([0, 0, 0, 0]), y = P.map((p, i) => Q[i][1] - p[1]).concat([0, 0, 0, 0]);   // + 4 phantom points
      if (x.some(d => d) || y.some(d => d)) deltas.push({tuple: k, x, y});
    });
    glyphs.push({contours: shapesFor(gb, tDef, runs), advance: gb.advance}); gv.push({deltas});
  }

  // named styles: the default, each recorded pose, and no face shape
  const at = changes => axes.map((ax, i) => (i in changes) ? changes[i] : ax.def);
  const instances = [{nameID: 2, coords: at({})}];
  variants.filter(vr => vr.label).forEach(vr => instances.push({name: vr.label, coords: at({[vr.a]: vr.peak > 0 ? axes[vr.a].max : axes[vr.a].min})}));
  instances.push({name: 'Reference', coords: at({[aL]: 0, [aR]: 0})});
  instances.forEach((ins, i) => { if (!ins.nameID) ins.nameID = 256 + axes.length + i; });

  const fam = ($('fontName').value || 'Reflect Face').trim().replace(/[^\w \-]/g, '').slice(0, 28) || 'Reflect Face';
  const family = fam + ' Variable';
  return {...writeTTF({family, glyphs, upm: upm * U, asc: (base.ascender || 878) * U, desc: (base.descender || -210) * U, capH: capH * U, xH: xH * U,
                       variable: {axes, instances, peaks, glyphs: gv}}), family, axes,
          vecs: {def, shapeL, shapeR, expr: variants.filter(vr => vr.e).map(vr => ({tag: axes[vr.a].tag, peak: vr.peak, e: vr.e}))}};
}

/* ---- a minimal TrueType writer ---- */
class Bytes {
  constructor(){ this.a = []; }
  u8(v){ this.a.push(v & 255); return this; }
  u16(v){ return this.u8(v >> 8).u8(v); }
  i16(v){ return this.u16(v < 0 ? v + 65536 : v); }
  u32(v){ return this.u16(Math.floor(v / 65536) & 65535).u16(v & 65535); }
  tag(s){ for (const ch of s) this.u8(ch.charCodeAt(0)); return this; }
  bytes(b){ for (const v of b) this.a.push(v); return this; }
  pad(){ while (this.a.length % 4) this.a.push(0); return this; }
  get length(){ return this.a.length; }
  out(){ return Uint8Array.from(this.a); }
}
function checksum(u8){
  let sum = 0;
  for (let i = 0; i < u8.length; i += 4) sum = (sum + ((u8[i] << 24) | ((u8[i+1] || 0) << 16) | ((u8[i+2] || 0) << 8) | (u8[i+3] || 0))) >>> 0;
  return sum;
}
function encodeGlyph(contours){
  if (!contours.length) return {data: new Uint8Array(0), xMin:0, yMin:0, xMax:0, yMax:0, points:0};
  let xMin = Infinity, yMin = Infinity, xMax = -Infinity, yMax = -Infinity, n = 0;
  contours.forEach(c => c.forEach(([x, y]) => { xMin = Math.min(xMin, x); yMin = Math.min(yMin, y); xMax = Math.max(xMax, x); yMax = Math.max(yMax, y); n++; }));
  const b = new Bytes().i16(contours.length).i16(xMin).i16(yMin).i16(xMax).i16(yMax);
  let end = -1; contours.forEach(c => { end += c.length; b.u16(end); });
  b.u16(0);                                            // no hinting instructions
  const flags = [], xs = new Bytes(), ys = new Bytes();
  let px = 0, py = 0;
  contours.forEach(c => c.forEach(([x, y]) => {
    let f = 1;                                         // on-curve point
    const dx = x - px, dy = y - py; px = x; py = y;
    if (dx === 0) f |= 0x10; else if (Math.abs(dx) < 256){ f |= 0x02 | (dx > 0 ? 0x10 : 0); xs.u8(Math.abs(dx)); } else xs.i16(dx);
    if (dy === 0) f |= 0x20; else if (Math.abs(dy) < 256){ f |= 0x04 | (dy > 0 ? 0x20 : 0); ys.u8(Math.abs(dy)); } else ys.i16(dy);
    flags.push(f);
  }));

  return {data: b.out(), xMin, yMin, xMax, yMax, points: n};
}
function nameTable(names){

function writeTTF({family, glyphs, upm, asc, desc, capH, xH, variable}){

  segs.forEach(s => sub.u16(s[1])); sub.u16(0); segs.forEach(s => sub.u16(s[0])); segs.forEach(s => sub.i16(s[2] > 32767 ? s[2] - 65536 : s[2])); segs.forEach(() => sub.u16(0));
  T['cmap'] = new Bytes().u16(0).u16(2).u16(0).u16(3).u32(20).u16(3).u16(1).u32(20).bytes(sub.a).out();
  const glyf = new Bytes(), loca = new Bytes();
  enc.forEach(e => { loca.u32(glyf.length); glyf.bytes(e.data); }); loca.u32(glyf.length);
  T['glyf'] = glyf.out(); T['loca'] = loca.out();
  const hmtx = new Bytes(); enc.forEach(e => hmtx.u16(e.advance).i16(e.points ? e.xMin : 0)); T['hmtx'] = hmtx.out();
  const names = {
    0: 'Built on Archivo Black, Copyright 2017 The Archivo Black Project Authors (https://github.com/Omnibus-Type/ArchivoBlack). Shaped by a face with MediaPipe Face Landmarker.',
    1: family, 2: 'Regular', 3: ps + ';' + new Date().toISOString().slice(0, 10), 4: family + ' Regular', 5: 'Version 1.000', 6: ps,
    13: 'This Font Software is licensed under the SIL Open Font License, Version 1.1.', 14: 'https://openfontlicense.org',
  };
  if (variable){
    variable.axes.forEach((ax, i) => { names[256 + i] = ax.name; });
    variable.instances.forEach(ins => { if (ins.name) names[ins.nameID] = ins.name; });
    T['fvar'] = fvarTable(variable);
    T['STAT'] = statTable(variable);
    T['gvar'] = gvarTable(variable, enc.length);
  }
  T['name'] = nameTable(names);
  T['post'] = new Bytes().u32(0x00030000).u32(0).i16(-100).i16(50).u32(0).u32(0).u32(0).u32(0).u32(0).out();

  const tags = Object.keys(T).sort();
  const head = new Bytes().u32(0x00010000).u16(tags.length).u16(128).u16(3).u16(tags.length * 16 - 128);
  let off = 12 + tags.length * 16;
  const bodies = new Bytes();
  tags.forEach(tag => { head.tag(tag).u32(checksum(T[tag])).u32(off).u32(T[tag].length); bodies.bytes(T[tag]).pad(); off = 12 + tags.length * 16 + bodies.length; });

  const adj = (0xB1B0AFBA - checksum(file)) >>> 0, at = 12 + tags.length * 16 + tags.slice(0, tags.indexOf('head')).reduce((s, t) => s + Math.ceil(T[t].length / 4) * 4, 0) + 8;
  file[at] = adj >>> 24; file[at+1] = (adj >>> 16) & 255; file[at+2] = (adj >>> 8) & 255; file[at+3] = adj & 255;

}

async function makeFont(){
  const base = await getBase();
  const upm = base.unitsPerEm, os2 = base.tables.os2 || {};
  const capH = os2.sCapHeight || 688, xH = os2.sxHeight || 528;
  const glyphs = [{contours: [], advance: 500 * U}, {contours: [], advance: (base.charToGlyph(' ').advanceWidth || 333) * U}];
  for (let li = 0; li < 26; li++) glyphs.push(glyphShapes(base, String.fromCharCode(65 + li), li, capH));   // A–Z
  for (let li = 0; li < 26; li++) glyphs.push(glyphShapes(base, String.fromCharCode(97 + li), li, capH));   // a–z, wired like their capitals
  const family = ($('fontName').value || 'Reflect Face').trim().replace(/[^\w \-]/g, '').slice(0, 28) || 'Reflect Face';
  return {...writeTTF({family, glyphs, upm: upm * U, asc: (base.ascender || 878) * U, desc: (base.descender || -210) * U, capH: capH * U, xH: xH * U}), family};
}

/* ---------- the start button: rest → poses → font → sliders ---------- */
let busy = false, built = null, rebuildTimer = 0;
const AXIS_LABELS = {MOUT:'mouth open', SMIL:'smile', BROW:'brow lift', LOOK:'look', LHLF:'left half', RHLF:'right half'};
const waitFor = async (test, ms) => { const t0 = performance.now(); while (!test()){ if (performance.now() - t0 > ms) return false; await sleep(50); } return true; };

async function runStart(){
  if (busy || !running) return;
  busy = true; $('startBtn').hidden = true; $('ttfVarBtn').disabled = true;
  try {
    // 1. your resting face (the camera drives the lines again while you pose)
    previewVec = null; dirty = true;
    frozen = false; $('freezeBtn').textContent = 'freeze';
    neutral = null; calib = [];
    prompt('relax your face\nlook straight');
    if (!await waitFor(() => neutral, 15000)){ prompt(''); status('no face found: sit in front of the camera and press start again'); return; }
    prompt('✓'); await sleep(600);
    // 2. the expressions
    for (const k of Object.keys(poses)) delete poses[k];
    await recordPoses();
    // 3. the font
    prompt('making your font…');
    await buildFont();
    prompt('');
  } catch (e) { prompt(''); status(`font failed: ${e.message}`); }
  finally { busy = false; if (running){ $('startBtn').textContent = 'start again'; $('startBtn').hidden = false; } }
}

// build the variable font from the recorded face, load it into the page and show its sliders
async function buildFont(){
  status('building your variable font…');
  const r = await makeVariableFont();
  built = {...r, name: $('fontName').value};
  showFont(r.axes);
  $('ttfVarBtn').disabled = false;
  status(`${r.family} is ready: try the sliders, then download`);
}

const axisVals = {};
function showFont(axes){
  const box = $('axes'); box.innerHTML = ''; box.hidden = false;
  axes.forEach(ax => {
    if (!(ax.tag in axisVals)) axisVals[ax.tag] = ax.def;
    const v = Math.max(ax.min, Math.min(ax.max, axisVals[ax.tag]));
    axisVals[ax.tag] = v;
    const lab = document.createElement('label');
    lab.innerHTML = `${AXIS_LABELS[ax.tag] || ax.name} <b>${v}</b><input type="range" id="ax-${ax.tag}" min="${ax.min}" max="${ax.max}" value="${v}">`;
    lab.querySelector('input').oninput = e => { axisVals[ax.tag] = +e.target.value; lab.querySelector('b').textContent = e.target.value; applyAxes(); };
    box.appendChild(lab);
  });
  applyAxes();
}
// the same sum the font does: each half of your face shape, plus each expression by its slider
function applyAxes(){
  if (!built) return;
  const {def, shapeL, shapeR, expr} = built.vecs, out = new Float32Array(def.length);
  const l = (axisVals.LHLF ?? 100) / 100, r = (axisVals.RHLF ?? 100) / 100;
  for (let j = 0; j < out.length; j++) out[j] = shapeL[j] * l + shapeR[j] * r;
  for (const x of expr){
    const t = (axisVals[x.tag] ?? 0) / 100 * x.peak;      // look: −100 uses look left, +100 look right
    if (t > 0) for (let j = 0; j < out.length; j++) out[j] += x.e[j] * t;
  }
  previewVec = out; dirty = true;
}
// settings that change the drawing rebuild the font (after a short pause), once it exists
function scheduleRebuild(){
  if (!built) return;
  clearTimeout(rebuildTimer);
  status('updating your font…');
  rebuildTimer = setTimeout(() => { if (!busy) buildFont().catch(e => status(`font failed: ${e.message}`)); }, 500);
}

async function downloadVariable(){
  if (!built) return;
  $('ttfVarBtn').disabled = true;
  try {
    if (built.name !== $('fontName').value){ await buildFont(); }   // renamed since it was built
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([built.buf], {type:'font/ttf'})); a.download = `${built.ps}.ttf`; a.click();
    status(`downloaded ${built.ps}.ttf`);
  } catch (e) { status(`font failed: ${e.message}`); }
  $('ttfVarBtn').disabled = false;
}
